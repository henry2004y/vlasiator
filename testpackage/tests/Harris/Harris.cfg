#number_of_restarts = 1
#write_restart_stripe_factor = 20

system_write_t_interval = 1.04
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -445111.8146460823 # [m/s]
vx_max = 445111.8146460823 # [m/s]
vy_min = -445111.8146460823 # [m/s]
vy_max = 445111.8146460823 # [m/s]
vz_min = -445111.8146460823 # [m/s]
vz_max = 445111.8146460823 # [m/s]
vx_length = 20
vy_length = 20
vz_length = 20

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 32
y_length = 1
z_length = 16
x_min = -921966.1428997584 # [m]
x_max = 921966.1428997584 # [m]
y_min = -28811.44196561745 # [m]
y_max = 28811.44196561745 # [m]
z_min = -460983.0714498792 # [m]
z_max = 460983.0714498792 # [m]
t_max = 60.0
dt = 0.33333333333333

[bailout]
max_memory = 50 # [GB/node]
min_dt = 1e-6 # [s]
velocity_space_wall_block_margin = 0

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
#output = populations_vg_ptensor
diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 25

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50
ohmGradPeTerm = 1
