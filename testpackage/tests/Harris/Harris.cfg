project = Harris
ParticlePopulations = proton

dynamic_timestep = 1

hallMinimumRho = 1e4

[io]
diagnostic_write_interval = 1
write_initial_state = 0
#restart_walltime_interval = 3600
#number_of_restarts = 1
#write_restart_stripe_factor = 20

system_write_t_interval = 50.
system_write_file_name = bulk
system_write_distribution_stride = 1
system_write_distribution_xline_stride = 8
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 8

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -487595.56298743526 # [m/s]
vx_max = 487595.56298743526 # [m/s]
vy_min = -487595.56298743526 # [m/s]
vy_max = 487595.56298743526 # [m/s]
vz_min = -487595.56298743526 # [m/s]
vz_max = 487595.56298743526 # [m/s]
vx_length = 20
vy_length = 20
vz_length = 20

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 16
y_length = 1
z_length = 16
x_min = -5.792884122784796e6 # [m]
x_max = 5.792884122784796e6 # [m]
y_min = -226284.53604628108 # [m]
y_max = 226284.53604628108 # [m]
z_min = -2.896442061392398e6 # [m]
z_max = 2.896442061392398e6 # [m]
t_max = 200.0
dt = 0.33333333333333

[bailout]
min_dt = 1e-6
velocity_space_wall_block_margin = 0

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
#output = populations_vg_ptensor
diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 25

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50
ohmGradPeTerm = 1
electronTemperature = 19212.58
electronDensity = 30e6
electronPTindex = 1.0

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = no
boundary = Outflow

[outflow]
precedence = 3
[proton_outflow]
face = z+
face = z-

[Harris]
Scale_size = 226284.53604628108 # [m]
BX0 = 1.0e-8 # [T]
BY0 = 0.0 # [T]
BZ0 = 0.0 # [T]
PSI0 = 0.0004525690720925622 # [T*m]

[proton_Harris]
n = 1.0e7 # [m^-3]
T = 240157.28355549558 # [K]
nSpaceSamples = 1
nVelocitySamples = 1
