project = Slab
ParticlePopulations = proton

dynamic_timestep = 0

hallMinimumRho = 1e4

[io]
diagnostic_write_interval = 1
write_initial_state = 0
#restart_walltime_interval = 3600
#number_of_restarts = 1
#write_restart_stripe_factor = 20

system_write_t_interval = 20.
system_write_file_name = bulk
system_write_distribution_stride = 1
system_write_distribution_xline_stride = 200
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 8

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -200e3
vx_max = +200e3
vy_min = -200e3
vy_max = +200e3
vz_min = -200e3
vz_max = +200e3
vx_length = 20
vy_length = 20
vz_length = 20

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 400
y_length = 1
z_length = 16
#z_length = 1
x_min = -2.6129087559953984e7
x_max = 2.6129087559953984e7
y_min = -130645.43779976992
y_max =  130645.43779976992
z_min = 0.0
z_max = 6.68904641534822e7
#z_min = 0.0
#z_max = 261290.87559953984
t_max = 100.0
dt = 0.33333333333333

[bailout]
min_dt = 1e-6
velocity_space_wall_block_margin = 0

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
#output = populations_vg_ptensor
diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 25

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50
ohmGradPeTerm = 1
electronTemperature = 19212.58
electronDensity = 30e6
electronPTindex = 1.0

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2

[boundaries]
periodic_x = no
periodic_y = yes
periodic_z = yes
boundary = Outflow
boundary = Maxwellian

[outflow]
precedence = 3
[proton_outflow]
face = x+

[maxwellian]
face = x-
precedence = 2
reapplyUponRestart = 1

[proton_maxwellian]
dynamic = 0
file_x- = upstream.dat

[Slab]
bx0L = 0.0
by0L = 0.0
bz0L = 10e-9
