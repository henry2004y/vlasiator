project = Slab
ParticlePopulations = proton

dynamic_timestep = 1

hallMinimumRho = 1e4

[io]
diagnostic_write_interval = 1
write_initial_state = 0
restart_walltime_interval = 300
number_of_restarts = 1
#write_restart_stripe_factor = 20

system_write_t_interval = 1
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 0
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -4.02e6
vx_max = +4.02e6
vy_min = -4.02e6
vy_max = +4.02e6
vz_min = -4.02e6
vz_max = +4.02e6
vx_length = 67
vy_length = 67
vz_length = 67

[proton_sparse]
minValue = 1.0e-15

[gridbuilder]
x_length = 25
y_length = 1
z_length = 32
x_min = -250e3
x_max =  250e3
y_min = -20e3
y_max =  20e3
z_min = 0.0
z_max = 2560e3
t_max = 1.0
dt = 0.01

[bailout]
min_dt = 1e-7
velocity_space_wall_block_margin = 0

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
output = populations_vg_ptensor
diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 25

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2

[boundaries]
periodic_x = no
periodic_y = yes
periodic_z = yes
boundary = Outflow
boundary = Maxwellian

[outflow]
precedence = 3
[proton_outflow]
face = x+

[maxwellian]
face = x-
precedence = 2
reapplyUponRestart = 1

[proton_maxwellian]
dynamic = 1
file_x- = upstream.dat

[Slab]
bx0L = 0.0
by0L = 0.0
bz0L = 10e-9
bx0R = 0.0
by0R = 0.0
bz0R = 10e-8

#AMR_L1width = 3.0e6
#AMR_L2width = 1.5e6

[proton_Slab]
nL   = 30e6
vx0L = 100e3
vy0L = 0.0
vz0L = 0.0
TL   = 1e5
nR   = 3e6
vx0R = 100e3
vy0R = 0.0
vz0R = 0.0
TR   = 1e5

nSpaceSamples = 1
nVelocitySamples = 1
