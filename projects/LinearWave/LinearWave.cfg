project = LinearWave
ParticlePopulations = proton

dynamic_timestep = 1

hallMinimumRho = 1e4

[io]
diagnostic_write_interval = 1
write_initial_state = 0
restart_walltime_interval = 7200
number_of_restarts = 1

system_write_t_interval = 10.
system_write_file_name = bulk
system_write_distribution_stride = 0
system_write_distribution_xline_stride = 200
system_write_distribution_yline_stride = 1
system_write_distribution_zline_stride = 8

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -200e3
vx_max = +200e3
vy_min = -200e3
vy_max = +200e3
vz_min = -200e3
vz_max = +200e3
vx_length = 40
vy_length = 40
vz_length = 40

[proton_sparse]
minValue = 1.0e-16

[gridbuilder]
x_length = 10
y_length = 1
z_length = 1
x_min = 0.0
x_max = 227774.44821277447
y_min = 0.0
y_max = 22777.444821277448
z_min = 0.0
z_max = 22777.444821277448
t_max = 1.0
dt = 0.33333333333333

[bailout]
min_dt = 1e-6
velocity_space_wall_block_margin = 0

[variables]
output = populations_vg_rho
output = populations_vg_v
output = vg_e_vol
output = vg_b_vol
output = vg_pressure
#output = populations_vg_ptensor
diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 25

[fieldsolver]
ohmHallTerm = 2
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50
ohmGradPeTerm = 0
electronTemperature = 19212.58
electronDensity = 30e6
electronPTindex = 1.0

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 22
maxSlAccelerationSubcycles = 2

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[LinearWave]
wavetype = fast
verbose = 1
