project = LinearWave
ParticlePopulations = proton

dynamic_timestep = 1

[io]
diagnostic_write_interval = 1
write_initial_state = 0

system_write_t_interval = 0.00458462
system_write_file_name = bulk
system_write_distribution_stride = 25
system_write_distribution_xline_stride = 25
system_write_distribution_yline_stride = 0
system_write_distribution_zline_stride = 0

[proton_properties]
mass = 1
mass_units = PROTON
charge = 1

[proton_vspace]
vx_min = -16e4
vx_max = +16e4
vy_min = -16e4
vy_max = +16e4
vz_min = -16e4
vz_max = +16e4
vx_length = 60
vy_length = 60
vz_length = 60

[proton_sparse]
minValue = 1.0e-21

[gridbuilder]
x_length = 25
y_length = 1
z_length = 1
x_min = 0.0
x_max = 100.
y_min = 0.0
y_max = 4.
z_min = 0.0
z_max = 4.
t_max = 0.00458462
dt = 0.2

[bailout]
min_dt = 1e-7
velocity_space_wall_block_margin = 1

[variables]
output = populations_vg_rho
output = populations_vg_v
#output = vg_e_vol
output = vg_b_vol
output = vg_pressure

diagnostic = populations_vg_blocks

[loadBalance]
rebalanceInterval = 50

[fieldsolver]
ohmHallTerm = 0
minCFL = 0.4
maxCFL = 0.45
maxSubcycles = 50
ohmGradPeTerm = 0

[vlasovsolver]
minCFL = 0.8
maxCFL = 0.99
maxSlAccelerationRotation = 10
maxSlAccelerationSubcycles = 10

[boundaries]
periodic_x = yes
periodic_y = yes
periodic_z = yes

[LinearWave]
wavetype = nowave
verbose = 1
